name: Schedule probe

# Temporary diagnostic (no secrets, no checkout, no repository access): does GitHub's scheduler fire for this
# repository at all? Delete this file once the hourly Job Hunter schedule has been seen to run.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule probe fired at $(date -u +%FT%TZ) by ${{ github.event_name }}"
