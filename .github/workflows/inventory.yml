name: Board Inventory

# Seeds the board registry from two public company lists and validates the new boards.
# This is deliberately SEPARATE from the hourly "Job Hunter" polling workflow:
#   - weekly: re-download both inventories, merge new boards, then validate (drain the backlog)
#   - daily:  validate only (the first import is ~20,000 boards; a weekly run alone cannot finish)
# Neither run scores jobs or sends alerts. Boards only start being polled hourly when they are
# promoted within the polling budget (Settings: Max_Active_Boards, Max_New_Boards_Per_Run).
# Two independently budgeted queues: never-validated candidates (--max-validations) and overdue
# re-checks of validated/invalid boards (--max-revalidations, oldest first), so the candidate
# backlog cannot starve the re-checks.

on:
  schedule:
    - cron: "23 5 * * 1" # weekly: Monday 05:23 UTC, refresh + validate
    - cron: "41 6 * * 2-6,0" # every other day of the week: validate only
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download the inventories before validating"
        type: boolean
        default: true

permissions:
  contents: read # nothing in the repository is written: state lives in the Google Sheet

# SAME concurrency group as the hourly Job Hunter workflow: every workflow that writes the shared
# registry (scheduled or started by hand) runs one at a time. A running job is never cancelled
# (cancel-in-progress: false); a run that arrives while another is running waits, and GitHub keeps
# only the NEWEST waiting run per group, so while a long import is running one waiting hourly poll
# can be replaced by the next one. An hourly poll is therefore delayed or skipped at most once per
# import (an import is capped at 40 minutes). The importer also takes the advisory writer lease and
# skips any row that is already monitored (merging its provenance), as defence in depth.
concurrency:
  group: job-hunter-state
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Last-known-good copies of the downloaded inventories (a bad download never replaces them).
      - name: Restore inventory cache
        uses: actions/cache@v4
        with:
          path: state/inventory
          key: inventory-cache-${{ github.run_id }}
          restore-keys: inventory-cache-

      - name: Check configuration
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          missing=""
          for name in GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_SHEET_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Refresh inventories and validate new boards
        env:
          STATE_LEASE_WAIT_SECONDS: "900" # wait for a crashed run's lease (30 min TTL) instead of failing
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          REFRESH=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "23 5 * * 1" ]; then REFRESH=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh }}" = "true" ]; then REFRESH=true; fi
          ARGS="--validate --max-validations 4000 --max-revalidations 2000 --max-seconds 1500"
          if [ "$REFRESH" = "true" ]; then ARGS="--import-inventory $ARGS"; fi
          python hunter.py $ARGS
