name: Job Hunter

on:
  schedule:
    # Hourly, around the clock (nights and weekends included). GitHub starts scheduled runs
    # late under load and may skip some; every run records its real gap in the hidden "Runs" tab.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Run one rotating (date-windowed) Google discovery now, outside the 12-hour schedule"
        type: boolean
        default: false
      backfill:
        description: "MANUAL ONLY: broad Google searches without the date window (boards only, capped credits)"
        type: boolean
        default: false

permissions:
  contents: write # only used by the local-CSV fallback (no Google Sheet configured)

# One run at a time, so two runs never write the same state.
concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Settings live in the Google Sheet; only the keys below are configured in GitHub.
      # Rotating discovery runs on its own schedule (Settings > Discovery_Every_Hours) within
      # Settings > Discovery_Credit_Budget. Unfiltered search only runs when 'backfill' is ticked by hand.
      - name: Poll boards, detect new jobs, score, deliver
        run: python hunter.py ${{ inputs.discover && '--discover' || '' }} ${{ inputs.backfill && '--backfill' || '' }}
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SEARCH_TBS: ${{ vars.SEARCH_TBS }} # optional; default qdr:d3. Blank/none cannot make scheduled discovery unfiltered.

      # Only does anything when GOOGLE_SHEET_ID is NOT set: the CSV files are then the state,
      # so they must survive between runs. always(): keep what was written even if the run failed.
      - name: Save local fallback state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f tracked_jobs.csv ] && git add -f tracked_jobs.csv
          [ -d state ] && git add -f state
          if git diff --cached --quiet; then
            echo "No local state changes."
          else
            git commit -m "chore: update local fallback state [skip ci]"
            git pull --rebase
            git push
          fi
