name: Job Hunter

on:
  schedule:
    # Hourly, around the clock (nights and weekends included). GitHub starts scheduled runs
    # late under load and may skip some; every run records its real gap and its trigger in the
    # hidden "Runs" tab (Notes: trigger=schedule | workflow_dispatch).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Run one rotating (date-windowed) web-search discovery now, outside the 12-hour schedule (spends search credits; may use the reserve)"
        type: boolean
        default: false
      backfill:
        description: "MANUAL ONLY: the same searches without the date window (boards only, capped credits, may use the reserve)"
        type: boolean
        default: false
      rebalance_report:
        description: "Print the dry-run board rebalance report (pool targets, coverage, planned decisions); changes nothing"
        type: boolean
        default: false
      pilot_report:
        description: "Print the pilot measurements for the last 7 days (polling gaps, fresh jobs by source, latency, failures, search usage, coverage, your feedback); changes nothing"
        type: boolean
        default: false
      trigger_source:
        description: "Set by an external hourly trigger (for example cron-job.org) so the run is recorded as external, not as a manual one. Leave empty when dispatching by hand."
        type: string
        default: ""
        required: false
      dashboard:
        description: "Only rebuild the Dashboard tab from the existing state (no polling, scoring, discovery or alerts); writes only that tab"
        type: boolean
        default: false
      delivery_test:
        description: "Send ONE clearly labelled synthetic job through scoring -> tracker -> Telegram to your TELEGRAM_CHAT_ID (you are authorizing that recipient by ticking this)"
        type: boolean
        default: false

# Nothing in this repository is written by the workflow: state lives in the Google Sheet.
permissions:
  contents: read

# One run at a time across BOTH workflows (see inventory.yml): scheduled and manually dispatched runs
# queue instead of overlapping, and a running job is never cancelled. GitHub keeps only the newest
# waiting run, so a poll queued behind a long import may be replaced by the next hourly one.
concurrency:
  group: job-hunter-state
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      # A run that crashed holding the state lease leaves it until its 30-minute TTL; the next run waits for it
      # (up to 10 minutes) instead of failing.
      TRIGGER_SOURCE: ${{ inputs.trigger_source }}
      STATE_LEASE_WAIT_SECONDS: "600"
      # Explicit user decision for the pilot (DECISIONS D-38): poll SmartRecruiters although its robots.txt asks
      # generic crawlers to stay out. Remove this line to park SmartRecruiters again (history is kept).
      ALLOW_SMARTRECRUITERS_BULK: "1"
      SEARCH_WINDOW_DAYS: ${{ vars.SEARCH_WINDOW_DAYS }} # optional; default 3 days. Scheduled discovery is always windowed (minimum 1).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Names only, never values. A production run needs the Sheet; without it the app would fall back to local
      # files that this workflow does not keep, so it refuses to run instead of silently losing state.
      # Telegram is required for any run that can deliver (the schedule, a poll, the delivery test): a poll without
      # it would mark qualifying jobs as "alerted" although nothing was sent. The read-only reports (pilot,
      # rebalance) do not deliver, so they may run before Telegram is configured.
      - name: Check configuration
        env:
          REQUIRE_TELEGRAM: ${{ (inputs.pilot_report || inputs.rebalance_report || inputs.dashboard) && 'no' || 'yes' }}
        run: |
          missing=""
          required="GROQ_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_SHEET_ID"
          if [ "$REQUIRE_TELEGRAM" = "yes" ]; then required="$required TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID"; fi
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          if [ -z "$TAVILY_API_KEY" ]; then echo "::warning::TAVILY_API_KEY is not set: web-search discovery is skipped, board polling still runs"; fi

      # Settings live in the Google Sheet; only the keys above are configured in GitHub.
      # Rotating discovery runs on its own schedule (Settings > Discovery_Every_Hours) within
      # Settings > Discovery_Credit_Budget and the monthly ledger (Settings > Search_Monthly_Credits, shared by
      # every search path). When the month's credits are used up, discovery is skipped and polling continues.
      # Unfiltered search only runs when 'backfill' is ticked by hand.
      - name: Poll boards, detect new jobs, score, deliver
        if: ${{ !inputs.rebalance_report && !inputs.pilot_report && !inputs.delivery_test && !inputs.dashboard }}
        run: python hunter.py ${{ inputs.discover && '--discover' || '' }} ${{ inputs.backfill && '--backfill' || '' }}

      # Read-only reports (tick by hand): they read the registry, ledger, Runs and tracker and write nothing.
      - name: Board rebalance report (dry run)
        if: ${{ inputs.rebalance_report }}
        run: python hunter.py --rebalance-report

      - name: Pilot report
        if: ${{ inputs.pilot_report }}
        run: python hunter.py --pilot-report 7

      # The synthetic fixture is isolated: no ledger event, no board row, a non-ATS URL, labelled everywhere.
      - name: Delivery test (labelled synthetic job)
        if: ${{ inputs.delivery_test }}
        run: python hunter.py --delivery-test --to "$TELEGRAM_CHAT_ID"

      # Rebuilds the generated Dashboard tab only (nothing else is read for decisions or written).
      - name: Dashboard refresh only
        if: ${{ inputs.dashboard }}
        run: python hunter.py --dashboard
